name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A shallow clone cannot be pushed to another repository ("shallow
          # update not allowed"), and this job pushes to a throwaway remote.
          fetch-depth: 0

      # The action commits and force-pushes a tag to the remote it is given, so
      # it is pointed at a throwaway bare repo here - never at `origin`.
      - name: Set Up Throwaway Remote
        id: setup-remote
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git init --bare "${RUNNER_TEMP}/test-remote.git"
          git checkout -B ci-test-branch
          git remote add testremote "${RUNNER_TEMP}/test-remote.git"
          git push testremote ci-test-branch
          git branch --set-upstream-to=testremote/ci-test-branch ci-test-branch
          echo 'binary url placeholder' > Package.swift

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          commitMessage: 'Update Package.swift'
          tagVersion: '9.9.9-ci'
          remote: 'testremote'

      - name: Verify Tag Was Pushed
        id: verify
        run: |
          tags="$(git --git-dir="${RUNNER_TEMP}/test-remote.git" tag -l)"
          echo "tags: ${tags}"
          if [ "${tags}" != "9.9.9-ci" ]; then
            echo "::error::expected tag 9.9.9-ci in the test remote, got '${tags}'"
            exit 1
          fi
          # The tagged commit must carry the updated file...
          git --git-dir="${RUNNER_TEMP}/test-remote.git" show 9.9.9-ci:Package.swift
          # ...and must not have been pushed onto any branch.
          if git --git-dir="${RUNNER_TEMP}/test-remote.git" branch --contains 9.9.9-ci 2>/dev/null | grep -q .; then
            echo "::error::tagged commit unexpectedly reachable from a branch"
            exit 1
          fi
